name: Testes
on:
  push:
    branches: [main, develop, 'feature/**', 'docs/**', 'chore/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    name: Testes Python ${{ matrix.python }} em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m coverage erase
      - run: python -m coverage run -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8
      - run: python -m coverage combine
      - run: python -m coverage report --fail-under=85
